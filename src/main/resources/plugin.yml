name: TBGeneral
version: '0.1-BETA'
main: org.TBCreates.TBGeneral.TBGeneral
api-version: '1.21'
load: STARTUP
authors: [thebestharrison]
description: A plugin for all your general needs
depend: [LuckPerms]

commands:
  givebook:
    description: Force give the TBGeneral Info book to a player.
    usage: /givebook <player>
    permission: tbgeneral.admin
    permission-message: You do not have permission to use this command.
  fly:
    description: Toggles flying for command sender.
    usage: /fly
    aliases: f
    permission: tbgeneral.admin
  gmc:
    description: Sets the player’s game mode to Creative.
    usage: /gmc
    permission: tbgeneral.admin
  gms:
    description: Sets the player’s game mode to Survival.
    usage: /gms
    permission: tbgeneral.admin
  gma:
    description: Sets the player’s game mode to Adventure.
    usage: /gma
    permission: tbgeneral.admin
  gmsp:
    description: Sets the player’s game mode to Spectator.
    usage: /gmsp
    permission: tbgeneral.admin
  menu:
    description: Opens the game mode selection menu.
    usage: /gmselect
    aliases: gmsel
    permission: tbgeneral.admin
  tbgeneral:
    description: Main command for TBGeneral plugin
    usage: /tbgeneral <reload>
    aliases: tbg
  tbgcommands:
    description: Useful commands for players
    usage: /tbg <sub-command>
    aliases: tbg
    permission: tbgeneral.admin
  heal:
    description: used to heal players
    usage: /heal <sub-command>
    permission: tbgeneral.admin
  bring:
    description: Useful commands to bring players
    usage: /bring <sub-command>
    permission: tbgeneral.admin
  goto:
    description: Useful commands to goto players
    usage: /goto <sub-command>
    permission: tbgeneral.admin
  openselectormenu:
    description: Opens the main menu.
    usage: /openselectormenu
    permission: tbgeneral.admin
  vanish:
    description: vanish.
    usage: /vanish
    permission: tbgeneral.admin
  msg:
    description: Custom private message command
    usage: /msg <player> <message>
    aliases: [tell, whisper]
    permission: tbgeneral.msg
  reply:
    description: Reply to the last private message
    usage: /reply <message>
    aliases: [r]
    permission: tbgeneral.use
  commandspy:
    description: Toggle CommandSpy to see all player commands.
    permission: tbgeneral.admin
  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: tbgeneral.tpa
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
    permission: tbgeneral.tpaccept
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
    permission: tbgeneral.tpdeny
permissions:
  tbgeneral.admin:
    description: Admin for tbgeneral plugin.